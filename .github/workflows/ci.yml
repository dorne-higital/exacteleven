name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn lint:style
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # The iOS app bundle (static, ssr:false). Then prove the player stats in
      # server/assets/players.json never reach it — the app ships every client
      # file to the device, so a leak there would expose every answer.
      - run: yarn build:app
      - run: ls .output/public/_fonts/*.woff2 > /dev/null
      - run: "! grep -rqE '\"goals\":[0-9]+,\"assists\":' .output/public"
